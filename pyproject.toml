[tool.ruff]
target-version = "py311"
line-length = 119
# src = ["trl"]

[tool.ruff.lint]
ignore = [
    "B028",  # warning without explicit stacklevel
    "C408",  # dict() calls (stylistic)
    "C901",  # function complexity
    "E501",  # line too long
    "T201",  # check print
]
extend-select = ["E", "F", "I", "W", "UP", "B", "T", "C"]
# "E": pycodestyle errors, such as incorrect whitespace and indentation.
# "F": Pyflakes checks, such as undefined names and unused imports.
# "I": isort rules for sorting and grouping imports.
# "W": pycodestyle warnings, such as invalid line breaks.
# "UP": pyupgrade rules for modernizing Python syntax.
# "B": flake8-bugbear rules for detecting likely bugs and bad practices.
# "T": rules for detecting print statements and debugger calls.
# "C": comprehension style and code-complexity checks.


[tool.ruff.lint.per-file-ignores]
# Allow prints in auxiliary scripts
"temp/**.py" = ["T201"]

# Ignore import violations in all `__init__.py` files.
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2
# known-first-party = ["trl"]